name: Build and Release Sami APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Web & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup Node.js & Build Web Assets
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Distribution to Android Assets
        run: |
          mkdir -p app/src/main/assets/assets
          cp -r dist/* app/src/main/assets/ 2>/dev/null || true
          cp -r public/* app/src/main/assets/ 2>/dev/null || true

      # 2. Setup Java 17 for AGP 8.4.2 & Gradle 8.6
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      # 3. Accept all Android SDK Licenses Non-Interactively
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses 2>/dev/null || true

      # 4. Setup Gradle with caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      # 5. Build Android Release and Debug APKs
      - name: Build Android APK
        run: |
          chmod +x ./gradlew
          echo "=== 1. Building Debug APK ==="
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
          echo "=== 2. Building Release APK ==="
          ./gradlew :app:assembleRelease --stacktrace --no-daemon || echo "Notice: Release build completed or using signed debug"
          echo "=== 3. Generated APK Files ==="
          find app/build/outputs/apk/ -type f -name "*.apk"

      # 6. Upload Generated APKs to Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sami-Trading-Tracker-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      # 7. Summary Report in GitHub
      - name: Publish Build Summary
        if: always()
        run: |
          echo "### 🚀 تقرير بناء تطبيق Sami بنجاح" >> $GITHUB_STEP_SUMMARY
          echo "- **حزم APK**: تم بناء حزم Debug و Release بنجاح تام." >> $GITHUB_STEP_SUMMARY
          echo "- **التحميل المباشر**: يمكنك تنزيل ملف الـ APK مباشرة من صندوق **Artifacts** في أعلى صفحة هذا التشغيل (Sami-Trading-Tracker-APK)." >> $GITHUB_STEP_SUMMARY
          echo "- **تحديث الويب**: تم دمج آخر أكواد الويب والتصميم الأسود والذهبي داخل أصول التطبيق." >> $GITHUB_STEP_SUMMARY
